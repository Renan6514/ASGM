<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>ASGM - Aviões da Segunda Guerra Mundial</title>
        <link rel="stylesheet" href="estilo/style.css">
    </head>
 
<body>
 
    <h1>Aviões da Segunda Guerra</h1>
 
    <nav>
        <a href="index.html">Home</a>
        <a href="contato.html">Contato</a>
        <a href="sobre.html">Sobre</a>
        <a href="login.html">Login</a>
    </nav>

    <main style="display: flex; flex-direction: column; align-items: center; padding: 60px 20px; gap: 48px;">

        <p style="font-size: 28px; margin: 0;">Entre em contato</p>

        <form action="#" method="post" style="width: 100%; max-width: 400px; background: rgb(29, 29, 29); padding: 28px 32px; border-radius: 7px; box-sizing: border-box;">

            <label for="nome" style="display: block; font-size: 14px; color: #aaa; margin-bottom: 6px;">Nome:</label>
            <input type="text" id="nome" name="nome" style="width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box;">

            <label for="email" style="display: block; font-size: 14px; color: #aaa; margin-bottom: 6px;">E-mail:</label>
            <input type="email" id="email" name="email" style="width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box;">

            <label for="mensagem" style="display: block; font-size: 14px; color: #aaa; margin-bottom: 6px;">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" style="width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: sans-serif; box-sizing: border-box;"></textarea>

            <button type="submit" style="padding: 10px 20px; background-color: #ffffff; color: rgb(0, 0, 0); border: none; border-radius: 4px; font-size: 15px; cursor: pointer;">Enviar</button>

        </form>

    </main>

</body>
</html>
